<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>세무자료 제출 안내</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --color-background-primary:#ffffff;
  --color-background-secondary:#f4f6f9;
  --color-background-tertiary:#eef2f7;
  --color-background-danger:#fdf0f0;
  --color-border-primary:#e2e6ec;
  --color-border-secondary:#dde3ea;
  --color-border-tertiary:#e8ecf1;
  --color-text-primary:#2e2c29;
  --color-text-secondary:#6b6864;
  --color-text-tertiary:#a4a09a;
  --color-text-danger:#c0392b;
  --border-radius-xl:20px;
  --border-radius-lg:12px;
  --border-radius-md:10px;
}
body{
  font-family:'Noto Sans KR',-apple-system,sans-serif;
  background:linear-gradient(160deg,#dce7f2 0%,#eef2f7 55%,#f0ede8 100%);
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:28px 16px 60px;
}
.card{
  background:var(--color-background-primary);
  border:0.5px solid var(--color-border-tertiary);
  border-radius:var(--border-radius-xl);
  width:100%;max-width:420px;overflow:hidden;
  box-shadow:0 1px 2px rgba(27,58,92,0.06),0 4px 16px rgba(27,58,92,0.10),0 12px 40px rgba(27,58,92,0.08);
}

/* ── Header ── */
.hd{
  background:linear-gradient(135deg,#162f4a 0%,#1b3a5c 50%,#1e4570 100%);
  padding:22px 20px 20px;position:relative;overflow:hidden;
}
.hd::after{
  content:'';position:absolute;top:-28px;right:-28px;width:110px;height:110px;
  border-radius:50%;background:rgba(255,255,255,0.04);pointer-events:none;
}
.logo-pill{
  display:inline-flex;align-items:center;background:rgba(255,255,255,0.97);
  border-radius:8px;padding:5px 11px;width:fit-content;
  box-shadow:0 1px 6px rgba(0,0,0,0.12);margin-bottom:14px;
}
.logo-pill img{height:24px;width:auto;display:block;object-fit:contain}
.logo-pill .logo-fallback{font-size:10px;font-weight:700;color:#1b3a5c;letter-spacing:0.12em;padding:2px 4px}
.hd-name{font-size:18px;color:#fff;font-weight:700;letter-spacing:-0.01em}
.hd-sub{font-size:12px;color:rgba(255,255,255,0.55);margin-top:4px;line-height:1.6}
.hd-sub strong{color:#fff;font-weight:700}
.hd-chips{display:flex;gap:6px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:4px 11px;font-size:11px;font-weight:600}
.chip-month{background:rgba(255,255,255,0.07);border:0.5px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.55)}
.chip-type{background:rgba(255,255,255,0.13);border:0.5px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.88)}

.body{padding:18px}

/* ── Dates card ── */
.dates-card{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;margin-bottom:16px}
.date-row{padding:14px 16px}
.date-row--deadline{background:var(--color-background-danger)}
.date-row--period{border-bottom:0.5px solid var(--color-border-tertiary)}

.dr-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.dr-label{font-size:10px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--color-text-tertiary)}
.dr-label--danger{color:var(--color-text-danger)}
.dr-badge{background:#e03535;border-radius:3px;padding:2px 7px;font-size:11px;font-weight:700;color:#fff}

.dr-date{font-size:14px;font-weight:700;color:var(--color-text-primary);letter-spacing:-0.01em}
.dr-date--danger{font-size:20px;color:var(--color-text-danger);letter-spacing:-0.02em}
.dr-desc{font-size:12px;color:var(--color-text-secondary);margin-top:4px}
.dr-desc--danger{color:var(--color-text-danger);opacity:0.7}

/* ── Notice ── */
.notice{display:flex;align-items:flex-start;gap:7px;font-size:12px;color:var(--color-text-secondary);line-height:1.55;margin-bottom:16px;padding:0 1px}

/* ── Link buttons ── */
.links{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.link-btn{display:flex;align-items:center;gap:12px;background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:11px 14px;text-decoration:none;cursor:pointer;transition:background 0.12s,border-color 0.12s,transform 0.1s;-webkit-tap-highlight-color:transparent}
.link-btn:hover{background:var(--color-background-secondary)}
.link-btn:active{transform:scale(0.99)}
.link-icon{width:34px;height:34px;border-radius:8px;background:rgba(27,58,92,0.07);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#1b3a5c;font-size:17px}
.link-text{flex:1}
.link-t1{font-size:13px;font-weight:700;color:var(--color-text-primary);display:block}
.link-t2{font-size:11px;color:var(--color-text-tertiary);display:block;margin-top:1px}
.link-arr{font-size:18px;color:var(--color-text-tertiary)}

.divider{border:none;border-top:0.5px solid var(--color-border-tertiary);margin:14px 0}

/* ── Error ── */
.error-box{display:none;margin-bottom:14px;background:#fdf0f0;border:1px solid #f0a0a0;border-radius:var(--border-radius-md);padding:10px 13px;font-size:13px;color:#b83232;line-height:1.5}
.error-box.show{display:block}

/* ── CTA buttons ── */
.cta-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cta-btn{border-radius:var(--border-radius-md);padding:14px 10px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;border:none;display:flex;flex-direction:column;align-items:center;gap:7px;transition:opacity 0.15s,transform 0.1s;line-height:1.3;text-align:center;-webkit-tap-highlight-color:transparent}
.cta-btn:active{transform:scale(0.97);opacity:0.88}
.cta-btn:disabled{opacity:0.45;cursor:not-allowed;transform:none}
.btn-submit{background:#1b3a5c;color:#fff}
.btn-none{background:var(--color-background-secondary);border:0.5px solid var(--color-border-secondary);color:var(--color-text-secondary)}
.cta-ico{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}
.cta-ico-s{background:rgba(255,255,255,0.15);color:#fff}
.cta-ico-n{background:rgba(0,0,0,0.06);color:var(--color-text-tertiary)}

/* ── Overlay ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(20,40,65,0.45);backdrop-filter:blur(2px);z-index:999;align-items:center;justify-content:center}
.overlay.show{display:flex}
.spinner{width:44px;height:44px;border:3px solid rgba(255,255,255,0.22);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Success screen ── */
.success{display:none;flex-direction:column;align-items:center;padding:52px 24px 44px;text-align:center;gap:10px}
.success.show{display:flex}
.success-icon{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;animation:pop 0.45s cubic-bezier(0.175,0.885,0.32,1.275);margin-bottom:6px}
@keyframes pop{0%{transform:scale(0.3);opacity:0}100%{transform:scale(1);opacity:1}}
.success h2{font-size:20px;font-weight:700;color:var(--color-text-primary)}
.success p{font-size:14px;color:var(--color-text-secondary);line-height:1.8}
.success-logo-badge{margin-top:28px;background:var(--color-background-tertiary);border-radius:8px;padding:5px 11px}
.success-logo-badge img{height:22px;width:auto;display:block;object-fit:contain;opacity:0.45}
</style>
</head>
<body>

<div class="card" id="mainCard">

  <div class="hd">
    <div class="logo-pill">
      <img id="logoImg" src="https://i.ibb.co/9DnxkWm/Chat-GPT-Image-2026-6-8-07-38-27.png" alt="로고"
           onerror="this.parentElement.style.display='none'">
    </div>
    <div class="hd-name"><span id="clientName">고객</span>님</div>
    <div class="hd-sub">세무신고 자료 제출 안내입니다.</div>
    <div class="hd-chips">
      <span class="chip chip-month"><i class="ti ti-calendar" aria-hidden="true"></i><span id="monthChip">2026년 6월</span></span>
      <span class="chip chip-type"><i class="ti ti-file-invoice" aria-hidden="true"></i><span id="typeChip">원천세</span></span>
    </div>
  </div>

  <div class="body">

    <div id="mainContent">

      <div class="dates-card">
        <div class="date-row date-row--period">
          <div class="dr-header">
            <span class="dr-label">자료 제출 대상 기간</span>
          </div>
          <div class="dr-date" id="periodDate">-</div>
          <div class="dr-desc">해당 기간의 자료를 제출해 주세요</div>
        </div>
        <div class="date-row date-row--deadline">
          <div class="dr-header">
            <span class="dr-label dr-label--danger">제출 마감일</span>
            <span class="dr-badge" id="ddayBadge" style="display:none"></span>
          </div>
          <div class="dr-date dr-date--danger" id="deadlineDate">-</div>
          <div class="dr-desc dr-desc--danger">이 날짜까지 꼭 업로드 부탁드립니다.</div>
        </div>
      </div>

      <div class="notice">
        <i class="ti ti-info-circle" style="color:#1b3a5c;font-size:15px;flex-shrink:0;margin-top:1px" aria-hidden="true"></i>
        제출 자료 가이드 확인  →  드라이브 업로드 → 해당하는 버튼 꼭 클릭
      </div>

      <div class="links">
        <a class="link-btn" id="notionBtn" href="#" target="_blank" rel="noopener">
          <div class="link-icon"><i class="ti ti-file-description" aria-hidden="true"></i></div>
          <div class="link-text">
            <span class="link-t1">제출 자료 가이드</span>
            <span class="link-t2">안내사항 확인하기</span>
          </div>
          <span class="link-arr">›</span>
        </a>
        <a class="link-btn" id="driveBtn" href="#" target="_blank" rel="noopener">
          <div class="link-icon"><i class="ti ti-cloud-upload" aria-hidden="true"></i></div>
          <div class="link-text">
            <span class="link-t1">구글 드라이브 업로드</span>
            <span class="link-t2">전용 폴더에 파일 첨부</span>
          </div>
          <span class="link-arr">›</span>
        </a>
      </div>

      <div class="divider"></div>

      <div class="error-box" id="errorBox">전송 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.</div>

      <div class="cta-row">
        <button class="cta-btn btn-submit" id="btnSubmitted" onclick="handleAction('submitted')">
          <div class="cta-ico cta-ico-s"><i class="ti ti-check" aria-hidden="true"></i></div>
          자료 제출 완료
        </button>
        <button class="cta-btn btn-none" id="btnNone" onclick="handleAction('none')">
          <div class="cta-ico cta-ico-n"><i class="ti ti-minus" aria-hidden="true"></i></div>
          제출할 자료 없음
        </button>
      </div>

    </div><div class="success" id="successScreen">
      <div class="success-icon" id="successIcon"></div>
      <h2 id="successTitle"></h2>
      <p id="successDesc"></p>
      <div class="success-logo-badge">
        <img src="https://i.ibb.co/9DnxkWm/Chat-GPT-Image-2026-6-8-07-38-27.png" alt="" onerror="this.parentElement.style.display='none'">
      </div>
    </div>

  </div></div><div class="overlay" id="overlay"><div class="spinner"></div></div>

<script>
/* ── URL params ─────────────────────────────────────────── */
const p = new URLSearchParams(window.location.search);
const clientId   = p.get('cid')      || '';
const clientName = decodeURIComponent(p.get('name') || '고객');
const month      = p.get('month')    || '';
const taxType    = p.get('type')     || '';
const dateStart  = p.get('start')    || '';  // 💡 URL의 start 파라미터를 받아오도록 수정
const dateEnd    = p.get('end')      || '';  // 💡 URL의 end 파라미터를 받아오도록 수정

const driveId    = p.get('drive')    || '#';
const notionId   = p.get('guide')    || '';

/* 노션 / 드라이브 버튼 링크 조합 */
const notionBtnElement = document.getElementById('notionBtn');
if (notionBtnElement) {
  notionBtnElement.href = notionId ? `https://nsdlab26.notion.site/${notionId}` : '#';
}
const driveBtnElement = document.getElementById('driveBtn');
if (driveBtnElement) {
  driveBtnElement.href = (driveId && driveId !== '#') ? `https://drive.google.com/drive/folders/${driveId}` : '#';
}

/* Make webhook URL */
const HOOK = 'https://hook.us2.make.com/7qmgrr2vfzvadz4ecow123ncmo02rb1t';

/* ── Populate fields ─────────────────────────────────────── */
document.getElementById('clientName').textContent = clientName;

const taxTypeMap = {
  'won': '원천세',
  'bup': '법인세',
  'jong': '종합소득세',
  'buga': '부가세'
};
const taxTypeText = taxTypeMap[taxType] || taxType || '세무신고';
document.getElementById('typeChip').textContent = taxTypeText;

if (month) {
  document.getElementById('monthChip').textContent = month;
}

/* ── 날짜 포맷 유틸 ──────────────────────────────────────── */
const WEEKDAYS = ['일','월','화','수','목','금','토'];

function parseDate(str) {
  // 다양한 입력 형식(YYYY-MM-DD, YYYY.MM.DD, YYYY/MM/DD) 지원
  if (!str) return null;
  const cleaned = str.trim().replace(/[./]/g, '-');
  const parts = cleaned.split('-').map(s => parseInt(s, 10));
  if (parts.length < 3 || parts.some(isNaN)) return null;
  const [y, m, d] = parts;
  return new Date(y, m - 1, d);
}

function formatDotDate(date) {
  if (!date) return '-';
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}.${m}.${d}`;
}

function formatKoreanDate(date) {
  if (!date) return '-';
  const y = date.getFullYear();
  const m = date.getMonth() + 1;
  const d = date.getDate();
  const w = WEEKDAYS[date.getDay()];
  return `${y}년 ${m}월 ${d}일 (${w})`;
}

/* ── 기간 / 마감일 채우기 ───────────────────────────────────── */
// 1. 자료 제출 기간: 알림톡에서 넘어온 텍스트(dateStart) 그대로 출력
if (dateStart) {
  document.getElementById('periodDate').textContent = dateStart;
}

// 2. 제출 마감일 및 D-day 계산: dateEnd만 날짜로 변환해서 사용
const endDate = parseDate(dateEnd);

if (endDate) {
  document.getElementById('deadlineDate').textContent = formatKoreanDate(endDate);

  // D-day 계산
  const today = new Date();
  today.setHours(0,0,0,0);
  const target = new Date(endDate);
  target.setHours(0,0,0,0);
  const diffDays = Math.round((target - today) / (1000 * 60 * 60 * 24));

  const badge = document.getElementById('ddayBadge');
  if (diffDays > 0) {
    badge.textContent = `D-${diffDays}`;
    badge.style.display = 'inline-flex';
  } else if (diffDays === 0) {
    badge.textContent = 'D-DAY';
    badge.style.display = 'inline-flex';
  } else {
    badge.textContent = `마감 (D+${Math.abs(diffDays)})`;
    badge.style.display = 'inline-flex';
  }
}

/* ── Webhook + success ───────────────────────────────────── */
async function handleAction(status) {
  document.getElementById('errorBox').classList.remove('show');
  document.getElementById('btnSubmitted').disabled = true;
  document.getElementById('btnNone').disabled = true;
  document.getElementById('overlay').classList.add('show');

  const url =
    `${HOOK}?cid=${encodeURIComponent(clientId)}`
    + `&month=${encodeURIComponent(month)}`
    + `&type=${encodeURIComponent(taxType)}`
    + `&status=${status}`;

  try {
    await fetch(url, { method: 'GET', mode: 'no-cors' });
    showSuccess(status);
  } catch (e) {
    document.getElementById('overlay').classList.remove('show');
    document.getElementById('btnSubmitted').disabled = false;
    document.getElementById('btnNone').disabled = false;
    document.getElementById('errorBox').classList.add('show');
  }
}

function showSuccess(status) {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('mainContent').style.display = 'none';

  const icon  = document.getElementById('successIcon');
  const title = document.getElementById('successTitle');
  const desc  = document.getElementById('successDesc');

  if (status === 'submitted') {
    icon.style.background = '#edf8f2';
    icon.innerHTML = '<i class="ti ti-check" style="color:#1a7a4a" aria-hidden="true"></i>';
    title.textContent = '제출 완료!';
    desc.innerHTML =
      '담당 세무사에게 자동으로 전달되었습니다.<br>'
      + '신고 준비가 완료되면 별도로 연락드리겠습니다.<br>감사합니다.';
  } else {
    icon.style.background = '#fff8ec';
    icon.innerHTML = '<i class="ti ti-alert-circle" style="color:#d4820a" aria-hidden="true"></i>';
    title.textContent = '확인했습니다.';
    desc.innerHTML =
      '제출 자료 없음으로 담당 세무사에게<br>전달되었습니다. 감사합니다.';
  }

  document.getElementById('successScreen').classList.add('show');
}
</script>
</body>
</html>
